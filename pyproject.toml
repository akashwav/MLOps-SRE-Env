[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-sre-env"
version = "1.0.0"
description = "A real-world SRE simulator for OpenEnv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.0.1",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    "openai>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "models.py", "client.py", "env.py"]

[project.scripts]
server = "server.app:main"